<svg xmlns="http://www.w3.org/2000/svg" width="430" height="560" viewBox="0 0 430 560" role="img" aria-labelledby="title desc">
<title id="title">Monograma FL — Fábio Luiz</title>
<desc id="desc">As iniciais F e L desenhadas com caracteres de terminal. Desenvolvimento web e projetos acadêmicos. Brasília, Brasil.</desc>
<style>
text { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
@keyframes cursor-blink {
  0%, 49% { opacity: .9; } 50%, 100% { opacity: 0; }
}
@keyframes status-breathe {
  0%, 100% { opacity: 1; } 50% { opacity: .4; }
}
.terminal-cursor { animation: cursor-blink 2s steps(1, end) infinite; }
.status-led { animation: status-breathe 5s ease-in-out infinite; }@keyframes float {
  0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); }
}
@keyframes ascii-wave {
  0%, 65%, 100% { opacity: 1; } 30% { opacity: .4; }
}
.monogram-motion { animation: float 6s ease-in-out infinite; }
.ascii { animation: ascii-wave 5s ease-in-out infinite; }@media (prefers-reduced-motion: reduce) {
  .terminal-cursor, .status-led, .monogram-motion, .ascii,
  .cell, .month, .metric-value { animation: none !important; }
}
</style>

